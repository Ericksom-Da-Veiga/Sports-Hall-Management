<div class="formulaire">  
    <div class="formulaire">
        <h3>Pessoal</h3>
        <form class="row g-3 needs-validation" (ngSubmit)="updateCoach()">
            <div class="col-md-3 form-champ">
              <label for="validationCustom01" class="form-label">CIN</label>
              <input type="text" [(ngModel)]="coach.cin" name="cin" class="form-control" id="validationCustom01" value="" required>
            </div>
            <div class="col-md-3 form-champ">
              <label for="validationCustom02" class="form-label">Nom</label>
              <input type="text" [(ngModel)]="coach.nom" name="nom" class="form-control" id="validationCustom02" value="" required>
            </div>
            
            <div class="col-md-3 form-champ">
              <label for="validationCustom03" class="form-label">Prenom</label>
              <input type="text" [(ngModel)]="coach.prenom" name="prenom" class="form-control" id="validationCustom03" required>
            </div>
            <div class="col-md-3 form-champ">
                <label for="validationCustomUsername" class="form-label">E-mail</label>
                <div class="input-group has-validation">
                  <span class="input-group-text" id="inputGroupPrepend">&#64;</span>
                  <input type="text" [(ngModel)]="coach.mail" name="mail" class="form-control" id="validationCustomUsername" aria-describedby="inputGroupPrepend" required>
                </div>
              </div>
              <div class="col-md-3 form-champ">
                <label for="validationCustom03" class="form-label">Password</label>
                <input type="password" [(ngModel)]="coach.password" name="password" class="form-control" id="validationCustom03" required>
              </div>
              <div class="col-md-3 form-champ">
                <label for="validationCustom05" class="form-label">Data de nascimento</label>
                <input type="date" [(ngModel)]="coach.date_entree" name="date_naissance" class="form-control" id="validationCustom05" required>
              </div>
              <div class="col-md-3 form-champ">
                <label for="validationCustom05" class="form-label">Telefone</label>
                <input type="number" [(ngModel)]="coach.telephone" name="telephone" class="form-control" id="validationCustom05" required>
              </div>
              <div class="col-md-3 form-champ">
                <label for="validationCustom05" class="form-label">Endereço</label>
                <input type="text" [(ngModel)]="coach.adress" name="adress" class="form-control" id="validationCustom05" required>
              </div>
              <div class="col-md-3 form-champ">
                <label for="validationCustom05" class="form-label">Desportos</label>
                <select  class="form-select" id="validationCustom04" required (change)="onSportChange($event)">
                  <option selected disabled>Escolher desporto</option>
                  <option *ngFor="let sport of sports" [(ngModel)]="idsport" name="idsport" [value]="sport.id">{{sport.nom}}</option>
                </select>
              </div>
              <button type="submit" class="btn btn-success">Guardar</button>
          </form>
    </div>
</div>
